<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">PGRAG — provenance-gated retrieval</title>
  <desc id="desc">A gold PGRAG wordmark beside a provenance flow. Source tiers converge at a gate that limits tools according to the weakest tier in context.</desc>
  <rect width="1200" height="390" rx="12" fill="#0b0c0b"/>
  <path d="M0 325H1200" stroke="#35362f" stroke-width="1"/>
  <path d="M52 49H170" stroke="#e6b93f" stroke-width="5"/>
  <text x="52" y="139" fill="#e6b93f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="78" font-weight="900">PGRAG</text>
  <text x="54" y="185" fill="#f4f1e8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="650">RETRIEVAL WITH PROVENANCE</text>
  <text x="54" y="229" fill="#b5b3a9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21">Review the source. Keep the tier. Gate the action.</text>
  <text x="54" y="281" fill="#e6b93f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">UNKNOWN SOURCE = TIER D</text>

  <g transform="translate(660 48)">
    <text x="0" y="18" fill="#9a998f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="1">PROVENANCE IS STRUCTURAL</text>
    <text x="0" y="55" fill="#f4f1e8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="650">Retrieved sources</text>

    <g transform="translate(0 76)">
      <rect width="86" height="52" rx="4" fill="#19221b" stroke="#6fcf97" stroke-width="2"/>
      <text x="43" y="35" text-anchor="middle" fill="#6fcf97" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="800">A</text>
      <rect x="98" width="86" height="52" rx="4" fill="#191f2a" stroke="#78a9f5" stroke-width="2"/>
      <text x="141" y="35" text-anchor="middle" fill="#78a9f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="800">B</text>
      <rect x="196" width="86" height="52" rx="4" fill="#262218" stroke="#e6b93f" stroke-width="2"/>
      <text x="239" y="35" text-anchor="middle" fill="#e6b93f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="800">C</text>
      <rect x="294" width="86" height="52" rx="4" fill="#281b19" stroke="#f17867" stroke-width="2"/>
      <text x="337" y="35" text-anchor="middle" fill="#f17867" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="800">D</text>
    </g>

    <path d="M43 145V172H337V145M190 172V202" fill="none" stroke="#e6b93f" stroke-width="2"/>
    <path d="M182 194L190 202L198 194" fill="none" stroke="#e6b93f" stroke-width="2"/>

    <rect x="65" y="210" width="250" height="58" rx="4" fill="#171815" stroke="#e6b93f" stroke-width="2"/>
    <text x="190" y="234" text-anchor="middle" fill="#e6b93f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">WEAKEST TIER</text>
    <text x="190" y="256" text-anchor="middle" fill="#f4f1e8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">sets the tool ceiling</text>

    <path d="M190 268V291" fill="none" stroke="#e6b93f" stroke-width="2"/>
    <path d="M182 283L190 291L198 283" fill="none" stroke="#e6b93f" stroke-width="2"/>
    <text x="190" y="316" text-anchor="middle" fill="#b5b3a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">OFFERED  +  CHECKED AGAIN</text>
  </g>

  <text x="54" y="360" fill="#77776f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">HUMAN REVIEW  /  WHOLE-DOCUMENT SCREENING  /  PER-TURN TOOL GATE</text>
  <text x="1138" y="360" text-anchor="end" fill="#e6b93f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">LOCAL DEMO</text>
</svg>