[pytest]
# A test that cannot fail is worth nothing; one that can HANG is worse, because
# CI reports neither a pass nor a failure and a run just sits there. This is not
# hypothetical: dropping .upper() from run_review_gate's input parse makes it
# re-read the same stubbed answer forever, and that wedged a run for 13 minutes
# with no output at all. Nothing in this suite legitimately takes a second, so
# anything past 60s is a bug by definition.
timeout = 60
